<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحتي الرئيسية على GitHub Pages">
  <title>الصفحة الرئيسية</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #f0f6ff, #fff); color: #17345a; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); background: white; border-radius: 22px; box-shadow: 0 14px 45px #163b6618; padding: 48px 30px; text-align: center; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 42px); }
    p { font-size: 18px; line-height: 1.9; color: #4b627e; }
    .button { display: inline-block; margin-top: 18px; padding: 12px 25px; background: #1767c7; color: white; text-decoration: none; border-radius: 10px; }
    .button:hover { background: #104e9a; }
    footer { margin-top: 30px; font-size: 13px; color: #687d96; }
  </style>
</head>
<body>
  <main>
    <h1>مرحبًا بك في موقعي</h1>
    <p>هذه الصفحة الرئيسية لموقعي المنشور باستخدام GitHub Pages.<br>يمكن تعديل النصوص والألوان وإضافة أقسام جديدة بسهولة.</p>
    <a class="button" href="https://github.com/" target="_blank" rel="noopener noreferrer">زيارة GitHub</a>
    <footer>تم إنشاء الصفحة باستخدام HTML وCSS</footer>
  </main>
</body>
</html>
